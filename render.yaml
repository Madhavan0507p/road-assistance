services:
  - type: web
    name: road-assistance
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
        value: defaultdb
      - key: DB_USER
        sync: false
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"
      - key: APP_URL
        sync: false
